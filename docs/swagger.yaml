basePath: /api/v1
definitions:
  main.CreatePublicRequest:
    properties:
      description:
        example: Resource description
        type: string
      name:
        example: Resource name
        type: string
    type: object
  main.ErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: Error message
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: This is a simple API to demonstrate Swagger integration in Go with
    Fiber.
  title: My API
  version: "1.0"
paths:
  /public:
    get:
      description: This is a public route that is accessible by everyone
      produces:
      - text/plain
      responses:
        "200":
          description: Hello, Public Page....!!!
          schema:
            type: string
      summary: Public route
      tags:
      - Public
    post:
      consumes:
      - application/json
      description: Creates a new public resource in the system
      parameters:
      - description: Resource creation data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/main.CreatePublicRequest'
      produces:
      - text/plain
      responses:
        "201":
          description: Resource created successfully
          schema:
            type: string
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Create public resource
      tags:
      - Public
  /upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a file to the server
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Upload successful
          schema:
            type: string
        "400":
          description: Failed to upload file
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Upload a file
      tags:
      - File Upload
  /user:
    get:
      responses: {}
      tags:
      - User
swagger: "2.0"
